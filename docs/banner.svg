<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Scrapeless Browser Instrumentation — reading is a guess, verify it">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.18" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="#0a0e13"/>
  <rect width="1200" height="660" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="660" rx="16" fill="url(#glowA)"/>
  <rect width="1200" height="660" rx="16" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="16" fill="none" stroke="#1c2430"/>

  <!-- ── left column ─────────────────────────────────────────── -->
  <g transform="translate(72,104)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#ffffff"/>
    <image x="5" y="5" width="30" height="30" xlink:href="data:image/jpeg;base64,"/>
    <text x="56" y="25" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700"
          letter-spacing="2.4" fill="#7f8b99">SCRAPELESS BROWSER INSTRUMENTATION</text>
  </g>

  <!-- textLength pins the advance width so a font fallback can never widen
       these lines into the panel on the right (they render identically
       whether or not Arial is installed) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#f2f5f8">
    <text x="72" y="238" font-size="54" textLength="498" lengthAdjust="spacingAndGlyphs">Reading is a guess.</text>
    <text x="72" y="304" font-size="54" textLength="252" lengthAdjust="spacingAndGlyphs">Verify it.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16.5" fill="#95a0ad">
    <text x="72" y="358" textLength="474" lengthAdjust="spacingAndGlyphs">Hook hostile JavaScript invisibly over CDP, capture what it</text>
    <text x="72" y="384" textLength="462" lengthAdjust="spacingAndGlyphs">really does, then check your reimplementation against the</text>
    <text x="72" y="410" textLength="252" lengthAdjust="spacingAndGlyphs">ground truth it just handed you.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8a95a3">
    <rect x="72"  y="452" width="150" height="30" rx="6" fill="#111821" stroke="#242e3b"/>
    <text x="147" y="471" text-anchor="middle" textLength="118" lengthAdjust="spacingAndGlyphs">INVISIBLE HOOKS</text>
    <rect x="234" y="452" width="140" height="30" rx="6" fill="#111821" stroke="#242e3b"/>
    <text x="304" y="471" text-anchor="middle" textLength="108" lengthAdjust="spacingAndGlyphs">GROUND TRUTH</text>
    <rect x="386" y="452" width="140" height="30" rx="6" fill="#111821" stroke="#242e3b"/>
    <text x="456" y="471" text-anchor="middle" textLength="108" lengthAdjust="spacingAndGlyphs">VERIFY ORACLE</text>
  </g>

  <!-- ── right column: the oracle catching a wrong reimplementation ── -->
  <g transform="translate(646,104)">
    <rect x="0" y="0" width="482" height="452" rx="12" fill="#0f141b" stroke="#1e2733"/>

    <rect x="0" y="0" width="482" height="38" rx="12" fill="#141b24"/>
    <rect x="0" y="26" width="482" height="12" fill="#141b24"/>
    <circle cx="20" cy="19" r="4.5" fill="#2b3542"/>
    <circle cx="36" cy="19" r="4.5" fill="#2b3542"/>
    <circle cx="52" cy="19" r="4.5" fill="#2b3542"/>
    <text x="72" y="23" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6f7c8b">s.verify("window.sign", ...)</text>
    <line x1="0" y1="38" x2="482" y2="38" stroke="#1e2733"/>

    <g font-family="Consolas, Menlo, monospace" font-size="12.5">
      <text x="26" y="72"  fill="#5f6b7a">HOOK</text>      <text x="150" y="72"  fill="#c9d3de">window.sign</text>
      <text x="26" y="96"  fill="#5f6b7a">CAPTURED</text>  <text x="150" y="96"  fill="#c9d3de">142 pairs</text>
      <text x="26" y="120" fill="#5f6b7a">MODE</text>      <text x="150" y="120" fill="#c9d3de">exact</text>

      <line x1="26" y1="140" x2="456" y2="140" stroke="#1b232e"/>

      <text x="26" y="168" fill="#2dd4bf" font-size="11" letter-spacing="1.2">YOUR CANDIDATE</text>
      <text x="26" y="194" fill="#8b96a5">(u,p) =&gt; btoa(u+':'+(p*7))</text>

      <line x1="26" y1="216" x2="456" y2="216" stroke="#1b232e"/>

      <text x="26" y="248" fill="#f87171" font-size="15" font-weight="700">✗  verified: false</text>
      <text x="26" y="272" fill="#6f7c8b">matched 138 / 142</text>

      <line x1="26" y1="294" x2="456" y2="294" stroke="#1b232e"/>

      <text x="26" y="324" fill="#fbbf24" font-size="11" letter-spacing="1.2">COUNTEREXAMPLE</text>
      <text x="26" y="352" fill="#5f6b7a">input</text>     <text x="150" y="352" fill="#c9d3de">["zoe", 0]</text>
      <text x="26" y="376" fill="#5f6b7a">expected</text>  <text x="150" y="376" fill="#4ade80">em9lOjE=</text>
      <text x="26" y="400" fill="#5f6b7a">got</text>       <text x="150" y="400" fill="#f87171">em9lOjA=</text>

      <text x="26" y="428" fill="#4b5665" font-size="11">off by the +1 — iterate until the diff is empty</text>
    </g>
  </g>
</svg>
